[project]
name = "ringpartner"
version = "0.1.0"
description = "Unofficial Python SDK for the Ring Partner API (Amazon Vision): typed REST client, WHEP live video, webhook verification, signed webhook simulator and fixture replay."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Brandon Garcia" }]
keywords = ["ring", "ring-appstore", "amazon-vision", "partner-api", "doorbell", "webrtc", "whep", "webhooks", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/HaDeZIB/ringpartner"
Repository = "https://github.com/HaDeZIB/ringpartner"
Documentation = "https://github.com/HaDeZIB/ringpartner#readme"
Issues = "https://github.com/HaDeZIB/ringpartner/issues"
Changelog = "https://github.com/HaDeZIB/ringpartner/blob/main/CHANGELOG.md"
"Used by" = "https://github.com/HaDeZIB/doorledger"

[project.optional-dependencies]
whep = ["aiortc>=1.9", "av>=12", "numpy>=1.26"]

[project.scripts]
ringpartner = "ringpartner.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ringpartner"]

[tool.hatch.build.targets.sdist]
include = ["src/ringpartner", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
