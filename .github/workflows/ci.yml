name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e ".[whep]" pytest pytest-asyncio respx ruff
      - run: uv run ruff check src tests examples
      - run: uv run pytest -q
      - run: cd examples && uv run python list_devices_history.py --replay fixtures/playground
